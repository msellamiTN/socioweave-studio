[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "socioweave-studio-api"
version = "0.1.0"
description = "SOCIOWEAVE Studio configuration preview API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["socioweave_studio*"]
