name: SOCIOWEAVE Studio API tests

on:
  push:
    paths:
      - "studio/**"
      - "engine/sociodec/catalogue.py"
      - "engine/sociodec/datasets.py"
      - "engine/sociodec/e1_protocol.py"
      - ".github/workflows/studio-api-tests.yml"
  pull_request:
    paths:
      - "studio/**"
      - "engine/sociodec/catalogue.py"
      - "engine/sociodec/datasets.py"
      - "engine/sociodec/e1_protocol.py"
      - ".github/workflows/studio-api-tests.yml"

jobs:
  studio-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            studio/pyproject.toml
      - name: Install engine, Studio API and test client
        run: |
          python -m pip install -e "engine[dev]" -e ./studio "httpx>=0.27,<1.0"
      - name: Check browser JavaScript syntax
        run: node --check studio/web/assets/app.js
      - name: Run Studio API tests
        run: python -m pytest -q studio/tests
