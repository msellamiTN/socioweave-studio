name: SocioDec Engine tests

on:
  push:
    paths:
      - "engine/**"
      - "docs/CORE-01-*.md"
      - "docs/CORE-02-*.md"
      - "docs/QUALITY-GATES.md"
      - ".github/workflows/engine-tests.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
